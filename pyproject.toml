# Session 6: Training Data Execution System
#
#   uv sync --all-groups
#   uv run python scripts/run_demo.py
#   uv run pytest tests -v

[project]
name = "session06-training-data-system"
version = "1.0.0"
description = "ERA V5 Session 6: Training Data Execution System"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.3",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "pydantic>=2.9",
    "tokenizers>=0.20",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
